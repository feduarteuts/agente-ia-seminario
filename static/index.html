<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soporte Técnico IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 30px auto;
      padding: 0 16px;
      background: #f4f6f9;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .barra-sesion {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button.secundario {
      background: #64748b;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #chat-box {
      height: 420px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      background: #f8fafc;
      margin-bottom: 14px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user {
      background: #dbeafe;
      margin-left: 12%;
      white-space: pre-wrap;
    }
    .bot {
      background: #e2e8f0;
      margin-right: 12%;
    }
    .bot p {
      margin: 0 0 8px 0;
    }
    .bot p:last-child {
      margin-bottom: 0;
    }
    .bot .titulo-seccion {
      display: block;
      font-weight: 700;
      font-size: 1.03em;
      color: #0f172a;
      margin: 10px 0 6px 0;
    }
    .bot .viñeta {
      display: block;
      padding-left: 14px;
      margin: 4px 0;
    }
    .bot hr.separador {
      border: none;
      border-top: 1px solid #cbd5e1;
      margin: 10px 0;
    }
    .fila-envio {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Mesa de Ayuda — Agente de Soporte Técnico</h2>
    <p>Describe fallos en PCs, programas, impresoras, red o Windows Update.</p>

    <div class="barra-sesion">
      <input type="text" id="sessionId" value="soporte_web_1" placeholder="ID de sesión" />
      <button class="secundario" type="button" onclick="limpiarSesion()">Limpiar sesión</button>
    </div>

    <div id="chat-box"></div>

    <form class="fila-envio" onsubmit="enviarMensaje(event)">
      <input type="text" id="mensajeInput" placeholder="Ej: Windows Update se queda en 0% o el programa se congela..." required />
      <button type="submit" id="btnEnviar">Enviar</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const mensajeInput = document.getElementById("mensajeInput");
    const sessionInput = document.getElementById("sessionId");
    const btnEnviar = document.getElementById("btnEnviar");

    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatearInline(texto) {
      let html = escaparHTML(texto);
      // Negritas **texto** y __texto__
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/__(.+?)__/g, "<strong>$1</strong>");
      // Código inline `codigo`
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      return html;
    }

    function formatearMarkdown(texto) {
      const lineas = String(texto).replace(/\r\n/g, "\n").split("\n");
      const bloques = [];
      let parrafoActual = [];

      function vaciarParrafo() {
        if (parrafoActual.length > 0) {
          bloques.push(`<p>${parrafoActual.join("<br>")}</p>`);
          parrafoActual = [];
        }
      }

      for (const linea of lineas) {
        const limpia = linea.trim();

        if (!limpia) {
          vaciarParrafo();
          continue;
        }

        if (/^-{3,}$/.test(limpia) || /^\*{3,}$/.test(limpia)) {
          vaciarParrafo();
          bloques.push('<hr class="separador" />');
          continue;
        }

        const matchHeading = limpia.match(/^#{1,6}\s+(.*)$/);
        if (matchHeading) {
          vaciarParrafo();
          bloques.push(`<span class="titulo-seccion">${formatearInline(matchHeading[1])}</span>`);
          continue;
        }

        const matchBullet = limpia.match(/^[-*•]\s+(.*)$/);
        if (matchBullet) {
          vaciarParrafo();
          bloques.push(`<span class="viñeta">• ${formatearInline(matchBullet[1])}</span>`);
          continue;
        }

        parrafoActual.push(formatearInline(limpia));
      }

      vaciarParrafo();
      return bloques.join("");
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      if (tipo === "user") {
        div.textContent = texto;
      } else {
        div.innerHTML = formatearMarkdown(texto);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function enviarMensaje(e) {
      e.preventDefault();
      const mensaje = mensajeInput.value.trim();
      const session_id = sessionInput.value.trim() || "default";
      if (!mensaje) return;

      agregarMensaje(`Tú: ${mensaje}`, "user");
      mensajeInput.value = "";
      btnEnviar.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje, session_id })
        });
        const data = await res.json();
        if (!res.ok) {
          agregarMensaje(`Error: ${data.detail || data.error || "No se pudo obtener respuesta"}`, "bot");
        } else {
          agregarMensaje(`Soporte: ${data.respuesta}`, "bot");
        }
      } catch (err) {
        agregarMensaje(`Error de conexión: ${err.message}`, "bot");
      } finally {
        btnEnviar.disabled = false;
        mensajeInput.focus();
      }
    }

    async function limpiarSesion() {
      const session_id = encodeURIComponent(sessionInput.value.trim() || "default");
      try {
        await fetch(`/chat/${session_id}`, { method: "DELETE" });
        chatBox.innerHTML = "";
        agregarMensaje("Sesión limpiada.", "bot");
      } catch (err) {
        agregarMensaje(`No se pudo limpiar la sesión: ${err.message}`, "bot");
      }
    }
  </script>
</body>
</html>
